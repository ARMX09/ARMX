<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEWAY × Kling AI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #f3f3f3; margin: 0; color: #333; }
    header { background: #0077cc; color: #fff; padding: 30px 16px; text-align: center; }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; opacity: .9; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tabs button { flex: 1; min-width: 120px; padding: 12px; border: 2px solid #0077cc; background: #fff; color: #0077cc; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .tabs button.active { background: #0077cc; color: #fff; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    textarea, select, input[type=text] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-family: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    .cta-button { display: block; width: 100%; margin-top: 20px; padding: 15px; background: #28a745; color: #fff; border: 0; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .cta-button:disabled { background: #9bc9a6; cursor: wait; }
    .status { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; }
    .status.info { display: block; background: #e8f3fc; color: #0b5394; }
    .status.error { display: block; background: #fdecea; color: #a12622; }
    .status.ok { display: block; background: #e9f7ee; color: #1e6b34; }
    .result { margin-top: 18px; display: grid; gap: 12px; }
    .result video, .result img { width: 100%; border-radius: 8px; background: #000; }
    .hidden { display: none; }
    .warn { background: #fff4d6; color: #7a5a00; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
    footer { background: #222; color: #fff; text-align: center; padding: 20px; font-size: 14px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>استوديو CODEWAY للأنيميشن</h1>
    <p>أنشئ فيديوهات وصوراً تعليمية بالذكاء الاصطناعي عبر Kling AI</p>
  </header>

  <main>
    <div class="card">
      <div id="warn" class="warn">مفاتيح Kling غير مضبوطة على الخادم بعد. أضفها في ملف <code>.env</code> ثم أعد تشغيل الخادم.</div>

      <div class="tabs">
        <button type="button" data-type="text2video" class="active">نص ← فيديو</button>
        <button type="button" data-type="image2video">صورة ← فيديو</button>
        <button type="button" data-type="image">نص ← صورة</button>
      </div>

      <form id="form">
        <div id="imageField" class="hidden">
          <label for="image">الصورة (ملف أو رابط)</label>
          <input type="file" id="imageFile" accept="image/png,image/jpeg">
          <input type="text" id="imageUrl" placeholder="أو الصق رابط الصورة هنا" style="margin-top:8px">
        </div>

        <label for="prompt">الوصف (يُفضّل بالإنجليزية)</label>
        <textarea id="prompt" placeholder="A cute cartoon robot teaching kids how to code, colorful classroom, 3D animation"></textarea>

        <label for="negative">ما لا تريد ظهوره (اختياري)</label>
        <input type="text" id="negative" placeholder="blurry, scary, text">

        <div class="row">
          <div id="aspectBox">
            <label for="aspect">الأبعاد</label>
            <select id="aspect"><option value="16:9">16:9 أفقي</option><option value="9:16">9:16 عمودي</option><option value="1:1">1:1 مربع</option></select>
          </div>
          <div class="video-only">
            <label for="duration">المدة</label>
            <select id="duration"><option value="5">5 ثوانٍ</option><option value="10">10 ثوانٍ</option></select>
          </div>
          <div class="video-only">
            <label for="mode">الجودة</label>
            <select id="mode"><option value="std">عادية</option><option value="pro">احترافية</option></select>
          </div>
          <div class="image-only hidden">
            <label for="count">عدد الصور</label>
            <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select>
          </div>
        </div>

        <button class="cta-button" id="submit" type="submit">إنشاء</button>
      </form>

      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
    </div>
  </main>

  <footer>&copy; 2025 CODEWAY - جميع الحقوق محفوظة.</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    let type = 'text2video';
    let pollTimer = null;

    fetch('/api/kling/status').then(r => r.json()).then(s => { if (!s.configured) $('warn').style.display = 'block'; }).catch(() => {});

    document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      type = btn.dataset.type;
      $('imageField').classList.toggle('hidden', type !== 'image2video');
      $('aspectBox').classList.toggle('hidden', type === 'image2video');
      document.querySelectorAll('.video-only').forEach(el => el.classList.toggle('hidden', type === 'image'));
      document.querySelectorAll('.image-only').forEach(el => el.classList.toggle('hidden', type !== 'image'));
    }));

    function setStatus(kind, text) { const s = $('status'); s.className = 'status ' + kind; s.textContent = text; }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearTimeout(pollTimer);
      $('result').innerHTML = '';
      const body = {
        prompt: $('prompt').value,
        negative_prompt: $('negative').value,
        aspect_ratio: $('aspect').value,
        duration: $('duration').value,
        mode: $('mode').value,
        n: $('count').value,
      };
      try {
        if (type === 'image2video') {
          const f = $('imageFile').files[0];
          body.image = f ? await fileToBase64(f) : $('imageUrl').value.trim();
        }
        $('submit').disabled = true;
        setStatus('info', 'جارٍ إرسال الطلب إلى Kling AI…');
        const res = await fetch('/api/kling/' + type, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const json = await res.json();
        if (!res.ok || json.code !== 0) throw new Error(json.message || 'فشل الطلب');
        poll(json.data.task_id, Date.now());
      } catch (err) {
        $('submit').disabled = false;
        setStatus('error', 'خطأ: ' + err.message);
      }
    });

    async function poll(taskId, startedAt) {
      try {
        const res = await fetch('/api/kling/' + type + '/' + encodeURIComponent(taskId));
        const json = await res.json();
        if (!res.ok || json.code !== 0) throw new Error(json.message || 'فشل الاستعلام');
        const d = json.data;
        const secs = Math.round((Date.now() - startedAt) / 1000);
        if (d.task_status === 'succeed') return showResult(d.task_result || {});
        if (d.task_status === 'failed') throw new Error(d.task_status_msg || 'فشلت المهمة');
        setStatus('info', `جارٍ الإنشاء… (${secs} ثانية) قد يستغرق ذلك بضع دقائق`);
        pollTimer = setTimeout(() => poll(taskId, startedAt), 5000);
      } catch (err) {
        $('submit').disabled = false;
        setStatus('error', 'خطأ: ' + err.message);
      }
    }

    function showResult(result) {
      $('submit').disabled = false;
      setStatus('ok', 'تم الإنشاء بنجاح! (الروابط مؤقتة، احفظ الملفات لديك)');
      (result.videos || []).forEach(v => {
        const el = document.createElement('video');
        el.src = v.url; el.controls = true; el.autoplay = true; el.loop = true;
        $('result').appendChild(el);
      });
      (result.images || []).forEach(i => {
        const el = document.createElement('img');
        el.src = i.url; el.alt = 'صورة منشأة';
        $('result').appendChild(el);
      });
    }
  </script>
</body>
</html>
